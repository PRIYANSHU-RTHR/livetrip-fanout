# Single entry point on :8080.
#   /ws          -> gateway-1/2/3 (websocket, least connections)
#   /v1/...      -> publisher (cab events, SOS, dev tokens)
#   /healthz     -> answered by nginx itself

worker_processes auto;

events {
    # Each proxied websocket holds two sockets (client + upstream).
    worker_connections 32768;
}

http {
    access_log off;

    upstream gateways {
        # Websockets live for hours; spread by open connections, not by
        # request count. A dead gateway is skipped for 10s after 1 failure.
        least_conn;
        server gateway-1:8080 max_fails=1 fail_timeout=10s;
        server gateway-2:8080 max_fails=1 fail_timeout=10s;
        server gateway-3:8080 max_fails=1 fail_timeout=10s;
    }

    upstream publisher {
        server publisher:8081;
        keepalive 64;
    }

    # Only send "Connection: upgrade" when the client asked for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        location = /healthz {
            return 200 "ok\n";
        }

        location /ws {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Must outlive the gateway's 25s ping so idle sockets stay open.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # A killed container's IP does not refuse, it just never answers:
            # give up fast and try the next gateway.
            proxy_connect_timeout 500ms;
            # Frames go straight through; queuing is the gateway's job.
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://publisher;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            client_max_body_size 64k;
        }

        location / {
            return 404;
        }
    }
}
